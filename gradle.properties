kotlin.code.style=official

# Configuration should be synced with [/gradle/build-logic/gradle.properties]
org.gradle.caching=true
org.gradle.isolated-projects=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Kizuna releases are built locally (no -Pdist), where Mihon's build-logic would leave the in-app
# updater off. It checks github.com/ohimeee/Kizuna/releases/latest; debug builds turn it off again.
enable-updater=true
